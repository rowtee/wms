# ==============================================================================
# Database Configuration File (database.properties)
# Workshop Management System (WMS) - PostgreSQL 18
# ==============================================================================

# --- Active Configuration: PostgreSQL 18 ---
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/wms_db
db.username=postgres
db.password=postgres

# --- Connection Pool Settings (HikariCP) ---
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1800000
db.pool.poolName=WmsPostgresPool
